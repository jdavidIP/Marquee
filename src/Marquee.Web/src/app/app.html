<header class="topbar">
  <div class="brand">Marquee</div>
  @if (auth.isLoggedIn()) {
    <nav class="nav">
      <a routerLink="/premiere" routerLinkActive="active">Premiere</a>
      <a routerLink="/library" routerLinkActive="active">Library</a>
      <a routerLink="/friends" routerLinkActive="active">Friends</a>
      @if (auth.canSeeOperations()) {
        <a routerLink="/admin" routerLinkActive="active">Operations</a>
      }
    </nav>
    <div class="account">
      <!-- Your own name is the way to your profile: it is where you already look for it. -->
      @if (auth.user()?.username; as me) {
        <a class="who" [routerLink]="['/u', me]" routerLinkActive="active">{{ me }}</a>
      }
      <button class="link" (click)="logout()">Sign out</button>
    </div>
  }
</header>

<main class="content">
  <router-outlet />
</main>
