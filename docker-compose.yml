# Local orchestration. Postgres is the durable record; Redis is the hot path for clap counting
# (Iteration 2); RabbitMQ carries the open-time fan-out off the request path (Iteration 4).
services:
  postgres:
    image: postgres:16
    container_name: marquee-postgres
    environment:
      POSTGRES_USER: marquee
      POSTGRES_PASSWORD: marquee
      POSTGRES_DB: marquee
    ports:
      - "5432:5432"
    volumes:
      - marquee-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquee -d marquee"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: marquee-redis
    # appendonly so the hot counters survive a restart within an active Premiere window.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - marquee-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: marquee-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: marquee
      RABBITMQ_DEFAULT_PASS: marquee
    ports:
      - "5672:5672"    # AMQP — the API publishes here, the worker consumes
      - "15672:15672"  # management UI: queue depth, the _error DLQ, message rates
    volumes:
      - marquee-rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Trace store and UI (Iteration 6). Jaeger's all-in-one image speaks OTLP directly, so the API and
  # the worker export straight to it and no separate OpenTelemetry Collector is needed for local work.
  # Storage is in-memory: traces are for watching a journey while you work on it, and losing them on
  # restart is the right trade for a dev dependency that should start instantly and need no volume.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: marquee-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI — search a trace by service, or paste a trace id straight in
      - "4317:4317"    # OTLP/gRPC — what TracingOptions.OtlpEndpoint points at
      - "4318:4318"    # OTLP/HTTP, for anything that cannot speak gRPC
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Stand-in for the Cognito user pool (DEPLOYMENT.md § Phase 2, decision 8): offline, no AWS
  # credentials, and every confirmation/reset code is CODE rather than an email. The pool and client are
  # seeded with fixed ids (docker/cognito-local/db) so local config can name them; users land in the
  # volume, and cp -n never overwrites them — which also means an edited seed only takes effect after
  # `docker volume rm marquee_marquee-cognitodata`. config.json is copied rather than mounted because the
  # emulator rewrites it on start. Fidelity gaps against the real pool are listed in DEPLOYMENT.md §2b.
  # Pinned by digest: the project publishes no version tags.
  cognito:
    image: jagregory/cognito-local@sha256:a5ad30d01da5016a38535a717f6e1642d1b37f886a7b17e90b67f6e5ad134831
    container_name: marquee-cognito
    entrypoint: ["sh", "-c", "cp /seed/config.json /app/.cognito/ && cp -n /seed/db/*.json /app/.cognito/db/ && exec node /app/start.js"]
    environment:
      CODE: "123456"
    ports:
      - "9229:9229"    # cognito-idp endpoint, issuer http://localhost:9229/local_marquee
    volumes:
      - marquee-cognitodata:/app/.cognito/db
      - ./docker/cognito-local:/seed:ro
    healthcheck:
      # 127.0.0.1, not localhost: inside the image localhost resolves to ::1, and it listens on IPv4 only.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9229/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  marquee-pgdata:
  marquee-redisdata:
  marquee-rabbitdata:
  marquee-cognitodata:
