# Local orchestration. Postgres is the durable record; Redis is the hot path for clap counting
# (Iteration 2); RabbitMQ carries the open-time fan-out off the request path (Iteration 4).
services:
  postgres:
    image: postgres:16
    container_name: marquee-postgres
    environment:
      POSTGRES_USER: marquee
      POSTGRES_PASSWORD: marquee
      POSTGRES_DB: marquee
    ports:
      - "5432:5432"
    volumes:
      - marquee-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquee -d marquee"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: marquee-redis
    # appendonly so the hot counters survive a restart within an active Premiere window.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - marquee-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: marquee-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: marquee
      RABBITMQ_DEFAULT_PASS: marquee
    ports:
      - "5672:5672"    # AMQP — the API publishes here, the worker consumes
      - "15672:15672"  # management UI: queue depth, the _error DLQ, message rates
    volumes:
      - marquee-rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  marquee-pgdata:
  marquee-redisdata:
  marquee-rabbitdata:
